name: probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: get apktool
        run: curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
      - name: decompile
        run: java -jar apktool.jar d -f input/Shizuku-orig.apk -o work
      - name: grep starter
        run: |
          cd work
          echo "smali count: $(find smali -name '*.smali' | wc -l)"
          echo '--- files with libshizuku.so ---'
          grep -rl 'libshizuku\.so' smali || true
          echo '--- files with --apk= ---'
          grep -rl -e '--apk=' smali || true
          echo '--- files with start_on_boot ---'
          grep -rl 'start_on_boot' smali || true
          echo '--- files with shizuku_starter ---'
          grep -rl 'shizuku_starter' smali || true
      - name: sanitize tree
        run: |
          set -e
          mkdir -p out
          cd work
          i=0
          find smali smali_assets res/xml res/values AndroidManifest.xml apktool.yml -type f | sort | while read -r f; do
            i=$((i+1))
            n=$(printf '%05d' $i)
            cp "$f" "../out/f_$n.smali"
            echo "$f" >> ../out/map.txt
          done
          cd ..
          echo "files: $(ls out | wc -l)"
      - uses: actions/upload-artifact@v4
        with:
          name: tree
          path: out
          retention-days: 3
