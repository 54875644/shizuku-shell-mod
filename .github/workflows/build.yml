name: build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK tools
        run: |
          if [ -n "$ANDROID_HOME" ]; then SDK="$ANDROID_HOME"; else SDK="/usr/local/lib/android/sdk"; fi
          echo "SDK=$SDK" >> "$GITHUB_ENV"
          echo "BT=$(ls -d "$SDK"/build-tools/* | tail -1)" >> "$GITHUB_ENV"
          echo "AJ=$(ls -d "$SDK"/platforms/android-3*/android.jar | tail -1)" >> "$GITHUB_ENV"

      - name: Download apktool
        run: |
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar
          java -jar apktool.jar --version

      - name: Decompile
        run: java -jar apktool.jar d -f input/Shizuku-orig.apk -o work

      - name: Apply patches
        run: python3 patch/apply.py work

      - name: Build ShellStart helper dex
        run: |
          set -e
          echo "build-tools: $BT"
          echo "android.jar: $AJ"
          mkdir -p javaout dexout
          javac --release 8 -encoding UTF-8 -classpath "$AJ" -d javaout \
            patch/java/moe/shizuku/manager/ShellStart.java
          "$BT/d8" --release --min-api 24 --lib "$AJ" --output dexout \
            $(find javaout -name '*.class' | sort)
          ls -l dexout
          python3 -c "d=open('dexout/classes.dex','rb').read(); assert d[:4]==b'dex\n', 'not a dex'; print('helper dex bytes:', len(d))"

      - name: Rebuild
        run: java -jar apktool.jar b -f work -o Shizuku-shellmod-unsigned.apk

      - name: Inject helper dex
        run: |
          set -e
          cp dexout/classes.dex classes2.dex
          zip -j Shizuku-shellmod-unsigned.apk classes2.dex
          unzip -l Shizuku-shellmod-unsigned.apk | grep -E 'classes[0-9]*\.dex'

      - name: Align and sign
        run: |
          set -e
          "$BT/zipalign" -p -f 4 Shizuku-shellmod-unsigned.apk Shizuku-shellmod-aligned.apk
          "$BT/apksigner" sign \
            --ks patch/mod-key.jks --ks-key-alias shellmod \
            --ks-pass pass:shellmod123 --key-pass pass:shellmod123 \
            --min-sdk-version 24 \
            --out Shizuku-shellmod.apk Shizuku-shellmod-aligned.apk
          "$BT/apksigner" verify --verbose Shizuku-shellmod.apk
          sha256sum Shizuku-shellmod.apk
          ls -l Shizuku-shellmod.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shizuku-apk
          path: Shizuku-shellmod.apk
